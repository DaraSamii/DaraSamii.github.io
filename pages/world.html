    <div class="world-fullscreen">
        <div id="worldMap" class="world-map"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
    (function () {
        // ============================================
        // Travel data lives in assets/data/travels.json —
        // edit that file to add trips. Each entry needs:
        // city, country, lat, lng, and optional year / notes.
        // ============================================
        const TRAVELS_URL = '../assets/data/travels.json';

        const rootStyle = getComputedStyle(document.documentElement);
        const COLOR_MARKER = rootStyle.getPropertyValue('--color-accent').trim() || '#f59e0b';
        const COLOR_MARKER_BORDER = rootStyle.getPropertyValue('--color-bg').trim() || '#0a0a0f';

        function initWorldMap(TRAVELS) {
            const mapEl = document.getElementById('worldMap');
            if (!mapEl || typeof L === 'undefined') return;

            const map = L.map(mapEl, {
                worldCopyJump: true,
                minZoom: 2,
                maxBoundsViscosity: 1.0,
                zoomControl: false
            }).setView([20, 10], 2);

            // Restrict vertical dragging to where map tiles actually exist
            // (Web Mercator projection stops rendering past ~85.06°) so you
            // can't drag into the blank gray area past the poles. Longitude
            // is left unbounded (Infinity) so it doesn't fight worldCopyJump's
            // seamless east-west wrap — bounding both axes made panning feel stuck.
            map.setMaxBounds(L.latLngBounds(
                L.latLng(-85.06, -Infinity),
                L.latLng(85.06, Infinity)
            ));

            // Default Leaflet zoom control sits top-left, which the fixed
            // navbar would otherwise sit on top of — moved to bottom-left.
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                subdomains: 'abc',
                maxZoom: 19
            }).addTo(map);

            TRAVELS.forEach(t => {
                const marker = L.circleMarker([t.lat, t.lng], {
                    radius: 6,
                    color: COLOR_MARKER_BORDER,
                    weight: 1.5,
                    fillColor: COLOR_MARKER,
                    fillOpacity: 1
                }).addTo(map);

                marker.bindPopup(`
                    <strong>${t.city}</strong>, ${t.country}${t.year ? ` &middot; ${t.year}` : ''}
                    ${t.notes ? `<br>${t.notes}` : ''}
                `);
            });

            window.addEventListener('resize', () => map.invalidateSize());
        }

        function boot() {
            fetch(TRAVELS_URL)
                .then(res => res.json())
                .then(travels => initWorldMap(travels))
                .catch(err => {
                    console.error('World map: could not load travel data:', err);
                    initWorldMap([]);
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    })();
    </script>
