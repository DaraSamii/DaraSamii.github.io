            <h1>🌍 World</h1>

    <section class="page-content">

            <div class="world-content">
                <p class="world-stats" id="worldStats">Loading travel data&hellip;</p>

                <div class="world-layout">

                    <div class="world-panel" id="worldPanel">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
    (function () {
        // ============================================
        // Travel data — edit this array to add trips.
        // countryCode must be the ISO 3166-1 alpha-3 code
        // (matches the ADM0_A3 property in the bundled
        // assets/data/countries-110m.geojson file).
        // ============================================
        const TRAVELS = [
            { city: "Montreal", country: "Canada", countryCode: "CAN", lat: 45.5017, lng: -73.5673, year: 2022, notes: "Home base for grad school" },
            { city: "Toronto",  country: "Canada", countryCode: "CAN", lat: 43.6532, lng: -79.3832, year: 2023, notes: "" },
            { city: "Tehran",   country: "Iran",   countryCode: "IRN", lat: 35.6892, lng: 51.3890,  year: 2019, notes: "Hometown" }
        ];

        const COUNTRIES_GEOJSON_URL = '../assets/data/countries-110m.geojson';

        const rootStyle = getComputedStyle(document.documentElement);
        const COLOR_VISITED = rootStyle.getPropertyValue('--color-success').trim() || '#10b981';
        const COLOR_VISITED_HOVER = rootStyle.getPropertyValue('--color-primary-light').trim() || '#818cf8';
        const COLOR_MARKER = rootStyle.getPropertyValue('--color-accent').trim() || '#f59e0b';
        const COLOR_MARKER_BORDER = rootStyle.getPropertyValue('--color-bg').trim() || '#0a0a0f';

        function renderStats() {
            const statsEl = document.getElementById('worldStats');
            if (!statsEl) return;
            const countries = new Set(TRAVELS.map(t => t.countryCode));
            const cities = new Set(TRAVELS.map(t => `${t.city}|${t.countryCode}`));
            statsEl.innerHTML = `<strong>${countries.size}</strong> countries &middot; <strong>${cities.size}</strong> cities visited`;
        }

        function showCountryPanel(countryName, countryCode) {
            const panel = document.getElementById('worldPanel');
            if (!panel) return;

            const cities = TRAVELS.filter(t => t.countryCode === countryCode);
            if (cities.length === 0) {
                panel.innerHTML = `
                    <div class="world-panel-placeholder">
                        <i class="fas fa-map-marked-alt"></i>
                        <p>No visits logged yet for ${countryName}.</p>
                    </div>`;
                return;
            }

            const items = cities.map(c => `
                <li>
                    <div class="world-city-header">
                        <span class="world-city-name">${c.city}</span>
                        ${c.year ? `<span class="world-city-year">${c.year}</span>` : ''}
                    </div>
                    ${c.notes ? `<p class="world-city-notes">${c.notes}</p>` : ''}
                </li>`).join('');

            panel.innerHTML = `<h3>${countryName}</h3><ul class="world-city-list">${items}</ul>`;
        }

        function initWorldMap() {
            const mapEl = document.getElementById('worldMap');
            if (!mapEl || typeof L === 'undefined') return;

            const map = L.map(mapEl, {
                worldCopyJump: true,
                minZoom: 2,
                maxBoundsViscosity: 1.0
            }).setView([20, 10], 2);

            map.setMaxBounds([[-85, -180], [85, 180]]);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            const visitedCodes = new Set(TRAVELS.map(t => t.countryCode));

            fetch(COUNTRIES_GEOJSON_URL)
                .then(res => res.json())
                .then(geojson => {
                    L.geoJSON(geojson, {
                        filter: feature => visitedCodes.has(feature.properties.ADM0_A3),
                        style: {
                            color: COLOR_VISITED,
                            weight: 1.5,
                            fillColor: COLOR_VISITED,
                            fillOpacity: 0.35
                        },
                        onEachFeature: (feature, layer) => {
                            const name = feature.properties.NAME;
                            const code = feature.properties.ADM0_A3;
                            layer.on({
                                mouseover: () => layer.setStyle({ fillOpacity: 0.6, weight: 2, color: COLOR_VISITED_HOVER }),
                                mouseout: () => layer.setStyle({ fillOpacity: 0.35, weight: 1.5, color: COLOR_VISITED }),
                                click: () => {
                                    showCountryPanel(name, code);
                                    map.fitBounds(layer.getBounds(), { maxZoom: 5 });
                                }
                            });
                        }
                    }).addTo(map);
                })
                .catch(err => {
                    console.error('World map: could not load country borders:', err);
                });

            TRAVELS.forEach(t => {
                const marker = L.circleMarker([t.lat, t.lng], {
                    radius: 6,
                    color: COLOR_MARKER_BORDER,
                    weight: 1.5,
                    fillColor: COLOR_MARKER,
                    fillOpacity: 1
                }).addTo(map);

                marker.bindPopup(`
                    <strong>${t.city}</strong>, ${t.country}${t.year ? ` &middot; ${t.year}` : ''}
                    ${t.notes ? `<br>${t.notes}` : ''}
                `);

                marker.on('click', () => showCountryPanel(t.country, t.countryCode));
            });
        }

        renderStats();

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initWorldMap);
        } else {
            initWorldMap();
        }
    })();
    </script>
